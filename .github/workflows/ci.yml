name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Before the checks: typecheck resolves the packages through their built
      # entry points, and the examples resolve dist rather than source.
      - run: npm run build

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Each example installs its package by file: path, so this is what
      # catches a broken exports map — it fails here rather than after release.
      # Both scripts build the workspace first, so no separate build step.
      - run: npm run examples:install
      - run: npm run examples:build
