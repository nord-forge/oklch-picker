name: Bug report
description: Something behaves differently from what the README describes.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The most useful thing you can include is a
        way to reproduce it. A few lines of code beat a long description.

  - type: dropdown
    id: package
    attributes:
      label: Which package?
      options:
        - oklch-picker (the custom element, no framework)
        - "@oklch-picker/react"
        - "@oklch-picker/vue"
        - "@oklch-picker/svelte"
        - "@oklch-picker/solid"
        - "@oklch-picker/core (colour maths / model)"
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "`npm ls oklch-picker` or the entry in your package.json."
      placeholder: 1.0.1
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can it be reproduced?
      description: |
        A minimal snippet, or a link to a StackBlitz / CodeSandbox. Include the
        colour value involved if the problem depends on one. Gamut behaviour
        varies a lot across the space.
      render: js
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and framework version
      placeholder: Chrome 141, React 19.0.0
    validations:
      required: false
